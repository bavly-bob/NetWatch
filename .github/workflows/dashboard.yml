name: Build & Release Dashboard (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.7.0 win64_msvc2019_64 -m qtnetwork qtsql
          echo "${{ github.workspace }}/6.7.0/msvc2019_64/bin" >> $env:GITHUB_PATH
          echo "Qt6_DIR=${{ github.workspace }}/6.7.0/msvc2019_64/lib/cmake/Qt6" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/6.7.0/msvc2019_64" >> $env:GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Boost via vcpkg
        run: |
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install boost-asio:x64-windows boost-system:x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/6.7.0/msvc2019_64" `
            -DQt6_DIR="${{ github.workspace }}/6.7.0/msvc2019_64/lib/cmake/Qt6" `
            -DBUILD_DASHBOARD=ON

      - name: Build Dashboard
        run: cmake --build build --config Release --target NetWatch

      - name: Deploy Qt DLLs
        run: |
          $env:PATH = "${{ github.workspace }}\6.7.0\msvc2019_64\bin;$env:PATH"
          cd build\Release
          windeployqt NetWatch.exe

      - name: Zip the release folder
        run: |
          Compress-Archive -Path build\Release\* -DestinationPath NetWatch-Windows.zip

      - name: Upload Dashboard to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NetWatch-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
